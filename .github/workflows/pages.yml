name: Build and deploy portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Scheduled articles become eligible at their timezone-aware publish_at.
    - cron: '7,37 0 * * *' # 09:07 and 09:37 JST; avoid the top-of-hour peak.
    - cron: '17 * * * *' # Hourly catch-up if an earlier run is delayed or dropped.
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: site/requirements.txt
      - run: python -m pip install -r site/requirements.txt
      - run: python -m unittest discover -s site -q
      - run: python site/build.py --strict-translations
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  verify-publication:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: deployed-artifact
      - run: mkdir -p deployed-site && tar -xf deployed-artifact/artifact.tar -C deployed-site
      - name: Verify published articles and sitemap
        run: python site/verify_deployment.py --dist deployed-site
  notify-indexnow:
    needs: verify-publication
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Notify IndexNow of canonical pages
        run: python site/notify_indexnow.py

