<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">From molecular design to decision-useful evidence</title>
  <desc id="desc">Design, build, test and learn form an iterative loop. Clinical evaluation provides separate evidence for decisions. Capacity, data quality and relevance are distinct constraints.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526577"/></marker></defs>
  <rect width="1120" height="560" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#203446">
    <text x="48" y="54" font-size="27" font-weight="700">More designs are not yet more evidence</text>
    <text x="48" y="87" font-size="17" fill="#526577">Conceptual framework · no measured capacities or market forecasts</text>
    <g fill="#eef4f8" stroke="#a9bdcc" stroke-width="1.5">
      <rect x="48" y="137" width="217" height="114" rx="12"/>
      <rect x="317" y="137" width="217" height="114" rx="12"/>
      <rect x="586" y="137" width="217" height="114" rx="12"/>
      <rect x="855" y="137" width="217" height="114" rx="12"/>
    </g>
    <g font-size="23" font-weight="700" text-anchor="middle">
      <text x="156" y="175">Design</text><text x="425" y="175">Build</text><text x="694" y="175">Test</text><text x="963" y="175">Learn</text>
    </g>
    <g font-size="16" text-anchor="middle">
      <text x="156" y="208">Propose candidates</text><text x="425" y="208">Make molecules</text><text x="694" y="208">Measure responses</text><text x="963" y="208">Update predictions</text>
      <text x="156" y="231">Scores and uncertainty</text><text x="425" y="231">Quality control</text><text x="694" y="231">Conditions and failures</text><text x="963" y="231">Validate prospectively</text>
    </g>
    <g stroke="#526577" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M270 194H308"/><path d="M539 194H577"/><path d="M808 194H846"/>
      <path d="M963 257V288H156V257"/>
    </g>
    <rect x="48" y="340" width="755" height="129" rx="12" fill="#edf5f0" stroke="#92b3a1" stroke-width="1.5"/>
    <rect x="855" y="340" width="217" height="129" rx="12" fill="#fff3e8" stroke="#c9ae8f" stroke-width="1.5"/>
    <text x="73" y="378" font-size="22" font-weight="700">Clinical evaluation</text>
    <text x="73" y="411" font-size="17">Exposure, biological effect, efficacy, safety and patient variability</text>
    <text x="73" y="440" font-size="17">Binding measurements alone do not establish patient benefit.</text>
    <text x="963" y="383" text-anchor="middle" font-size="22" font-weight="700">Decisions</text>
    <text x="963" y="414" text-anchor="middle" font-size="17">Candidate · dose</text>
    <text x="963" y="441" text-anchor="middle" font-size="17">Continue · stop</text>
    <path d="M808 405H846" stroke="#526577" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="48" y="521" font-size="18">Three distinct questions: Is capacity limited? Is the measurement valid? Is it relevant to the decision?</text>
  </g>
</svg>
