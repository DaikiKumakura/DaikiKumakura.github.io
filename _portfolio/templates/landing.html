<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  {% if preview %}<meta name="robots" content="noindex,nofollow">{% endif %}
  <title>{{ site.name }}</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body><div class="shell">
<main id="main">
  {% if preview %}<p class="notice">Prototype preview / <span lang="ja">試作・プレビュー</span></p>{% endif %}
  <h1>{{ site.name }}</h1>
  <p lang="ja">熊倉大騎 — 数理生物学・バイオインフォマティクス</p>
  <p>{{ site.profile.en }}</p>
  <nav class="languages" aria-label="Language"><a href="ja/index.html" lang="ja" hreflang="ja">日本語</a><a href="en/index.html" lang="en" hreflang="en">English</a></nav>
  <p><a href="{{ site.linkedin }}" rel="me">LinkedIn</a> · <a href="{{ site.github }}" rel="me">GitHub</a> · <a href="{{ site.orcid }}" rel="me">ORCID</a></p>
</main>
</div></body>
</html>
